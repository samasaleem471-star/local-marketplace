<svg width="700" height="500" viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="title">Local marketplace illustration</title>
<desc id="desc">A flat illustration of a market stall with items for sale, a price tag, and a small neighborhood skyline in the background.</desc>

<rect width="700" height="500" fill="#F4F6FB"/>

<!-- background neighborhood -->
<rect x="40" y="120" width="90" height="140" rx="4" fill="#DCE4F5"/>
<rect x="150" y="90" width="70" height="170" rx="4" fill="#E6ECFA"/>
<rect x="490" y="100" width="80" height="160" rx="4" fill="#E6ECFA"/>
<rect x="580" y="130" width="70" height="130" rx="4" fill="#DCE4F5"/>
<rect x="60" y="150" width="18" height="18" fill="#B9C6E8"/>
<rect x="94" y="150" width="18" height="18" fill="#B9C6E8"/>
<rect x="60" y="190" width="18" height="18" fill="#B9C6E8"/>
<rect x="94" y="190" width="18" height="18" fill="#B9C6E8"/>
<rect x="170" y="120" width="16" height="16" fill="#C7D2EF"/>
<rect x="196" y="120" width="16" height="16" fill="#C7D2EF"/>
<rect x="170" y="150" width="16" height="16" fill="#C7D2EF"/>
<rect x="196" y="150" width="16" height="16" fill="#C7D2EF"/>
<rect x="510" y="130" width="16" height="16" fill="#C7D2EF"/>
<rect x="540" y="130" width="16" height="16" fill="#C7D2EF"/>
<rect x="510" y="160" width="16" height="16" fill="#C7D2EF"/>
<rect x="540" y="160" width="16" height="16" fill="#C7D2EF"/>
<rect x="598" y="160" width="16" height="16" fill="#B9C6E8"/>
<rect x="624" y="160" width="16" height="16" fill="#B9C6E8"/>

<!-- ground -->
<rect x="0" y="380" width="700" height="120" fill="#E9EDF6"/>

<!-- stall canopy -->
<path d="M170 190 L530 190 L560 250 L140 250 Z" fill="#0D6EFD"/>
<path d="M170 190 L530 190 L530 205 L170 205 Z" fill="#3D8BFF"/>
<rect x="150" y="250" width="30" height="130" fill="#0A58CA"/>
<rect x="520" y="250" width="30" height="130" fill="#0A58CA"/>

<!-- table -->
<rect x="150" y="330" width="400" height="16" rx="2" fill="#8592B0"/>
<rect x="170" y="346" width="16" height="60" fill="#6C7A9C"/>
<rect x="514" y="346" width="16" height="60" fill="#6C7A9C"/>

<!-- items on table -->
<rect x="200" y="270" width="70" height="60" rx="4" fill="#FFB020"/>
<rect x="200" y="270" width="70" height="14" rx="4" fill="#E39A0C"/>

<circle cx="330" cy="300" r="30" fill="#20C997"/>
<rect x="322" y="272" width="16" height="20" rx="3" fill="#178F6D"/>

<rect x="390" y="280" width="60" height="50" rx="6" fill="#FF6B6B"/>
<circle cx="420" cy="280" r="14" fill="#FF6B6B"/>

<rect x="470" y="290" width="50" height="40" rx="4" fill="#845EF7"/>

<!-- price tag -->
<g transform="translate(455,235) rotate(18)">
  <path d="M0 0 L44 0 L58 14 L44 28 L0 28 Z" fill="#212529"/>
  <circle cx="10" cy="14" r="3.5" fill="#F4F6FB"/>
  <text x="26" y="19" font-family="Arial, sans-serif" font-size="12" fill="#F4F6FB" text-anchor="middle">$</text>
</g>

<!-- two simple people -->
<g>
  <circle cx="255" cy="415" r="16" fill="#495057"/>
  <path d="M225 470 Q225 430 255 430 Q285 430 285 470 Z" fill="#0D6EFD"/>
</g>
<g>
  <circle cx="430" cy="415" r="16" fill="#495057"/>
  <path d="M400 470 Q400 430 430 430 Q460 430 460 470 Z" fill="#20C997"/>
</g>

</svg>
