  <body>
    <!-- NAVBAR start -->
    <nav class="navbar bg-body-tertiary fixed-top" id="navbar-container">
      <div

        <!-- Email + Toggle button ek sath, right side -->

          <h3 id="uiEmail" class="mb-0 fs-6"></h3>

          <button
            class="navbar-toggler"
            type="button"
            data-bs-toggle="offcanvas"
            data-bs-target="#offcanvasNavbar"
            aria-controls="offcanvasNavbar"
            aria-label="Toggle navigation"
          >
            <span class="navbar-toggler-icon"></span>
          </button>
        </div>

        <div
          class="offcanvas offcanvas-end"
          tabindex="-1"
          id="offcanvasNavbar"
          aria-labelledby="offcanvasNavbarLabel"

          <div class="offcanvas-header">
            <h5 class="offcanvas-title" id="offcanvasNavbarLabel">
              local-marketplace
            </h5>

              type="button"
              class="btn-close"
              data-bs-dismiss="offcanvas"
              aria-label="Close"

          </div>
          <div class="offcanvas-body">
            <ul class="navbar-nav justify-content-end flex-grow-1 pe-3">
              <li class="nav-item">
                <a
                  class="nav-link active"
                  aria-current="page"

              <li class="nav-item">
                <a class="nav-link" id="logoutBtn" href="./feed.html">Feed</a>

              <li class="nav-item">
                <a class="nav-link" id="logoutBtn" href="../index.html"
                  >Log out</a
                >
              </li>
            </ul>
            <form class="d-flex mt-3" role="search">
              <input
                class="form-control me-2"
                type="search"
                placeholder="Search"
                aria-label="Search"
              />
              <button class="btn btn-outline-success" type="submit">
                Search
              </button>
            </form>
          </div>
        </div>
      </div>
    </nav>
    <!-- NAVBAR end -->

    <!-- USER DASHBOARD INFO START -->
 <div class="container mt-4">
  <h2 class="mb-4">Dashboard</h2>

  <div id="mainDashboardInfo" class="card p-4 mb-4 shadow-sm">
    <div class="d-flex align-items-center justify-content-between">
      
      <div class="d-flex align-items-center gap-3">
        <div
          id="userPfp"
          class="rounded-circle d-flex align-items-center justify-content-center bg-primary text-white"
          style="
            width: 84px;
            height: 84px;
            font-size: 28px;
            font-weight: 500;
            flex-shrink: 0;
          "
        ></div>

        <div id="userInfo">
          <h2 id="userName" class="mb-1 fs-5"></h2>
          <h3 id="userEmail" class="mb-1 fs-6 text-muted"></h3>
          <h5 id="userJoinDate" class="mb-0 fs-6 text-muted"></h5>
        </div>
      </div>

      <button class="btn btn-outline-primary">
        Edit Profile
      </button>

    </div>
  </div>
</div>
    <!-- USER DASHBOARD INFO START -->

    <!-- USER POSTED ITEMS  -->
<div class="d-flex align-items-center justify-content-between p-5" >
<h4>
  My Posts 
</h4>
<button class="btn btn-outline-primary" id="newPostBtn" data-bs-toggle="modal" data-bs-target="#newPostModal">
  New Post
</button>
</div>

<div id="postsContainer" class="d-flex flex-wrap gap-3"></div>
<!-- USER POSTED ITEMS  -->


<!-- NEW POST BUTTON  -->
<div class="modal fade" id="newPostModal" tabindex="-1" aria-labelledby="newPostModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="newPostModalLabel">New Post</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="newPostForm">
          <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" class="form-control" id="postTitle" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Price</label>
            <input type="number" class="form-control" id="postPrice" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea class="form-control" id="postDescription" rows="3" required></textarea>
          </div>
          <div class="mb-3">
            <label class="form-label">Image</label>
            <input type="file" class="form-control" id="postImage" accept="image/*" required>
          </div>
          <button type="submit" class="btn btn-primary w-100" id="uploadItemBtn">Post Item</button>
        </form>
      </div>
    </div>
  </div>
</div>
<!-- NEW POST BUTTON  -->



    <!-- links  -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../app.js"></script>
    <!-- links  -->
  </body>
</html>
